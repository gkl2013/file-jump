<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#26A69A"/>
      <stop offset="100%" style="stop-color:#00897B"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="22" ry="22" fill="url(#bg3)"/>
  <!-- 代码括号 { } -->
  <text x="20" y="82" font-family="Menlo, Consolas, monospace" font-size="52" font-weight="300" fill="white" opacity="0.3">{</text>
  <text x="90" y="82" font-family="Menlo, Consolas, monospace" font-size="52" font-weight="300" fill="white" opacity="0.3">}</text>
  <!-- 鼠标指针 + 点击效果 -->
  <g transform="translate(42, 26)">
    <!-- 指针 -->
    <path d="M16,0 L16,40 L24,32 L34,48 L40,44 L30,28 L40,28 Z" fill="white" opacity="0.95"/>
    <!-- 点击波纹 -->
    <circle cx="16" cy="0" r="8" fill="none" stroke="#FFD740" stroke-width="2" opacity="0.7"/>
    <circle cx="16" cy="0" r="14" fill="none" stroke="#FFD740" stroke-width="1.5" opacity="0.4"/>
  </g>
  <!-- 底部 @ 标记 -->
  <text x="64" y="108" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle" opacity="0.8">@alias</text>
</svg>
